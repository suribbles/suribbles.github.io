<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:260},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;otto&quot;,&quot;penny&quot;,&quot;dash&quot;,&quot;pulse&quot;,&quot;scout&quot;,&quot;radar&quot;,&quot;ace&quot;],&quot;default&quot;:&quot;otto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200,&quot;min&quot;:60,&quot;max&quot;:400,&quot;tsType&quot;:&quot;number&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;pop&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;delay&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;still&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showTag&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const M = {
      otto:  { name: 'Otto',  accent: '#62D84E', hand: '#5BCB48', eye: '#FFFFFF', faceTop: '50%', sig: 'nsSpin 1.4s cubic-bezier(.4,0,.2,1) 1' },
      penny: { name: 'Penny', accent: '#2FBF71', hand: '#E3AC36', eye: '#2A1A05', faceTop: '58%', sig: 'nsCoin 1s cubic-bezier(.3,.7,.3,1) 1' },
      dash:  { name: 'Dash',  accent: '#3B9BFF', hand: '#2F80ED', eye: '#0B1A2C', faceTop: '54%', sig: 'nsZip .7s ease-out 1' },
      pulse: { name: 'Pulse', accent: '#FF7A6B', hand: '#F2675A', eye: '#3A0C08', faceTop: '45%', sig: 'nsBeat 1s ease-out 1' },
      scout: { name: 'Scout', accent: '#F0A93B', hand: '#D48E2E', eye: '#3A2205', faceTop: '68%', sig: 'nsLook 1.2s ease-in-out 1' },
      radar: { name: 'Radar', accent: '#2EC4C9', hand: '#1FA5AA', eye: '#05282A', faceTop: '58%', sig: 'nsBreathe .8s ease-in-out 1' },
      ace:   { name: 'Ace',   accent: '#A47BFF', hand: '#8A5CF0', eye: '#1A0838', faceTop: '54%', sig: 'nsNod .9s ease-out 1' }
    };
    const kind = this.props.kind ?? 'otto';
    const m = M[kind] || M.otto;
    const size = Number(this.props.size ?? 200);
    const active = !!this.props.active;
    const still = !!this.props.still;
    const a = (v) => still ? 'none' : v;
    const isOtto = kind === 'otto';
    return {
      ...m,
      w: size, h: size * 1.2, scale: size / 200,
      isOtto, isPenny: kind === 'penny', isDash: kind === 'dash', isPulse: kind === 'pulse', isScout: kind === 'scout', isRadar: kind === 'radar', isAce: kind === 'ace',
      showTag: this.props.showTag ?? true,
      eyeSize: isOtto ? 9 : 12, eyeGap: isOtto ? 14 : 22,
      mouthW: isOtto ? 14 : 18, mouthH: active ? 11 : 8,
      mouthFill: active ? m.eye : 'transparent',
      glowOpacity: active ? 0.95 : 0.4,
      popAnim: this.props.pop && !still ? `nsPop .75s cubic-bezier(.3,.7,.3,1) ${this.props.delay ?? 0}ms both` : 'none',
      bobAnim: a(`nsBob ${active ? 2.2 : 4}s ease-in-out infinite`),
      breatheAnim: a('nsBreathe 3.6s ease-in-out infinite'),
      glowAnim: a('nsGlow 3.2s ease-in-out infinite'),
      sigAnim: active && !still ? m.sig : 'none',
      blinkAnim: a(`nsBlink ${active ? 2.4 : 4.5}s ease-in-out infinite`),
      waveAnim: active && !still ? 'nsWave .9s ease-in-out infinite' : 'none',
      tagAnim: a('nsTag 3s ease-in-out infinite'),
      lineAnim: a(`nsLine ${active ? 0.9 : 2.2}s linear infinite`),
      needleAnim: still ? 'none' : (active ? 'nsNeedle 1.4s cubic-bezier(.3,.7,.3,1) 1 forwards' : 'nsSway 3.4s ease-in-out infinite'),
      sweepAnim: a(`nsSpin ${active ? 1.2 : 3.5}s linear infinite`),
      rippleAnim: a(`nsRipple ${active ? 1.1 : 2.6}s ease-out infinite`),
      sparkAnim: a(`nsSpark ${active ? 0.8 : 2.8}s ease-in-out infinite`)
    };
  }
}
</script>
</body>
</html>
